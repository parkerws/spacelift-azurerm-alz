apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: landing-zone-portal
data:
  DATABASE_URL: "postgresql://postgres:changeme-in-production@postgres:5432/landing_zone_portal"
  REDIS_URL: "redis://redis:6379/0"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  DEPLOYMENT_PLATFORM: "spacelift"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: landing-zone-portal
type: Opaque
stringData:
  SECRET_KEY: "your-secret-key-here-change-in-production"
  SPACELIFT_API_KEY_SECRET: ""
  GITHUB_TOKEN: ""
  AZURE_CLIENT_SECRET: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: landing-zone-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: landing-zone-portal-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: landing-zone-portal
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
