version: "1"

# Module metadata
module:
  name: azure-vnet
  description: "Azure Virtual Network module with DDoS protection, encryption, and DNS configuration"
  provider: azurerm
  category: networking

# Automated tests
tests:
  - name: basic-validation
    description: "Validate basic VNet configuration"
    command: |
      cd examples/basic
      terraform init
      terraform validate
      terraform fmt -check

  - name: basic-plan
    description: "Test basic VNet deployment plan"
    command: |
      cd examples/basic
      terraform init
      terraform plan -out=tfplan

  - name: advanced-validation
    description: "Validate advanced VNet configuration with all features"
    command: |
      cd examples/advanced
      terraform init
      terraform validate
      terraform fmt -check

  - name: advanced-plan
    description: "Test advanced VNet deployment plan with DDoS, DNS, and encryption"
    command: |
      cd examples/advanced
      terraform init
      terraform plan -out=tfplan

# Spacelift stack defaults for modules using this
stack_defaults:
  runner_image: public.ecr.aws/spacelift/runner-terraform:latest
  terraform_version: "1.9.0"

# Auto-attach policies for stacks using this module
policies:
  plan:
    - network-security
    - cost-control

# Notification settings
notifications:
  on_failure: true
  on_success: false
